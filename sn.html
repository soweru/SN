      else lines.push(c.textContent.trim());
    });
    out.push({id:"n"+(i+1),title:h?h.textContent.trim():"",text:lines.join("\n").replace(/Проследить за Владимиром/g,"Владимир")});
  });
  return out;
}
function migrate(D){
  D.tasks=D.tasks||[];D.branches=D.branches||[];
  D.tasks.forEach(function(t){if(!Array.isArray(t.w))t.w=t.w?[t.w]:["s"];delete t.c});
  D.branches.forEach(function(b){delete b.ic});
  if(!D.graph){
    var pos={root:{x:.5,y:.5}},links=[],n=D.branches.length;
    D.branches.forEach(function(b,i){var a=-Math.PI/2+i*2*Math.PI/n;pos[b.id]={x:+(.5+Math.cos(a)*.42).toFixed(4),y:+(.5+Math.sin(a)*.4).toFixed(4)};links.push(["root",b.id])});
    D.graph={root:"Все задачи",pos:pos,links:links};
  }
  D.branches.forEach(function(b,i){if(!D.graph.pos[b.id])D.graph.pos[b.id]={x:.2+(i%5)*.15,y:.1}});
  if(!D.notes)D.notes=D.focusHtml?parseNotes(D.focusHtml):[];
  delete D.focusHtml;
  return D;
}

function applyOp(D,op){
  var t;
  if(op.k==="tog"){t=findT(D,op.id);if(t){if(op.x)t.x=true;else delete t.x}}
  else if(op.k==="add"){if(!findT(D,op.t.id))D.tasks.push(clone(op.t))}
  else if(op.k==="del"){D.tasks=D.tasks.filter(function(x){return x.id!==op.id})}
  else if(op.k==="edit"){t=findT(D,op.id);if(t)Object.keys(op.f).forEach(function(k){var v=op.f[k];if(v===null||v==="")delete t[k];else t[k]=clone(v)})}
  else if(op.k==="graph"){D.branches=clone(op.branches);D.graph=clone(op.graph)}
  else if(op.k==="bren"){if(op.id==="root")D.graph.root=op.name;else D.branches.forEach(function(b){if(b.id===op.id)b.name=op.name})}
  else if(op.k==="notes"){D.notes=clone(op.notes)}
}
function doOp(op){applyOp(S,op);pendingOps.push(op);render();setStatus("Сохраняю…");clearTimeout(saveTimer);saveTimer=setTimeout(save,600)}
function save(tries){
  tries=tries||0;
  if(saving||!pendingOps.length)return;
  saving=true;var n=pendingOps.length;
  sb.from("board").update({data:S,version:version+1,updated_at:new Date().toISOString()}).eq("id","main").eq("version",version).select("version").then(function(r){
    saving=false;
    if(r.error){setStatus("Не сохранилось — проверь интернет");saveTimer=setTimeout(save,5000);return}
    if(!r.data||!r.data.length){
      if(tries>3){setStatus("Не удалось сохранить — обнови страницу");return}
      fetchBoard().then(function(f){
        if(f.error||!f.data){setStatus("Не удалось сохранить — обнови страницу");return}
        S=migrate(f.data.data);version=f.data.version;pendingOps.forEach(function(op){applyOp(S,op)});render();save(tries+1);
      });
      return;
    }
    version=r.data[0].version;pendingOps=pendingOps.slice(n);
    if(pendingOps.length)save();else setStatus("Сохранено");
  }).catch(function(){saving=false;setStatus("Не сохранилось — проверь интернет");saveTimer=setTimeout(save,5000)});
}
function refresh(){
  if(!S||saving||pendingOps.length||gEdit||noteEdit)return;
  fetchBoard().then(function(r){if(r.data&&r.data.version!==version&&!pendingOps.length&&!gEdit&&!noteEdit){S=migrate(r.data.data);version=r.data.version;render()}}).catch(function(){});
}

}
function bindGraph(){
  var svg=$("gsvg");if(!svg||!gEdit)return;
  svg.addEventListener("pointerdown",function(e){
    var g=e.target.closest("g.node");
    if(!g){gEdit.sel=null;gEdit.connect=false;redrawGraphUI();return}
    e.preventDefault();drag={id:g.getAttribute("data-id"),sx:e.clientX,sy:e.clientY,moved:false};
    try{svg.setPointerCapture(e.pointerId)}catch(x){}
  });
  svg.addEventListener("pointermove",function(e){
    if(!drag)return;
    if(!drag.moved&&Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)<6)return;
    drag.moved=true;
    var r=svg.getBoundingClientRect(),sz=gSize();
    var x=(e.clientX-r.left-GP)/(sz.W-2*GP),y=(e.clientY-r.top-GP*0.7)/(sz.H-GP*1.9);
    gEdit.graph.pos[drag.id]={x:+Math.min(1,Math.max(0,x)).toFixed(4),y:+Math.min(1,Math.max(0,y)).toFixed(4)};
    drawGraph();
  });
  function up(){if(!drag)return;var d=drag;drag=null;if(!d.moved)tapNode(d.id)}
  svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",function(){drag=null});
}
function tapNode(id){
  if(gEdit.connect&&gEdit.sel&&id!==gEdit.sel){
    var a=gEdit.sel,L=gEdit.graph.links,i=-1;
    L.forEach(function(l,k){if((l[0]===a&&l[1]===id)||(l[0]===id&&l[1]===a))i=k});
    if(i>=0)L.splice(i,1);else L.push([a,id]);
    gEdit.connect=false;
  } else {gEdit.sel=gEdit.sel===id?null:id;gEdit.connect=false}
  redrawGraphUI();
}
function redrawGraphUI(){var box=$("gbox");if(!box)return;var tmp=document.createElement("div");tmp.innerHTML=graphHTML();box.replaceWith(tmp.firstChild);drawGraph();bindGraph()}
function graphAct(a){
  var G=gEdit&&gEdit.graph,sel=gEdit&&gEdit.sel;
  if(a==="gedit"){gEdit={branches:clone(S.branches),graph:clone(S.graph),sel:null,connect:false};redrawGraphUI();return}
  if(a==="gcancel"){gEdit=null;redrawGraphUI();return}
  if(a==="gsave"){var e=gEdit;gEdit=null;doOp({k:"graph",branches:e.branches,graph:e.graph});return}
  if(a==="gconn"){gEdit.connect=!gEdit.connect;redrawGraphUI();return}
  if(a==="gadd"){
    var name=prompt("Название нового кружка (ветки):");if(!name||!name.trim())return;
    var id="b"+Date.now(),from=sel||"root",fp=G.pos[from]||{x:.5,y:.5};
    gEdit.branches.push({id:id,name:name.trim()});
    G.pos[id]={x:+Math.min(.95,Math.max(.05,fp.x+(fp.x>.5?-.18:.18))).toFixed(4),y:+Math.min(.95,Math.max(.05,fp.y+.12)).toFixed(4)};
    G.links.push([from,id]);gEdit.sel=id;redrawGraphUI();return;
  }
  if(a==="gren"&&sel){
    var cur=sel==="root"?G.root:branch(sel).name,nn=prompt("Новое название:",cur);if(!nn||!nn.trim())return;
    if(sel==="root")G.root=nn.trim();else gEdit.branches.forEach(function(b){if(b.id===sel)b.name=nn.trim()});
    redrawGraphUI();return;
  }
  if(a==="gdel"&&sel&&sel!=="root"){
    var cnt=S.tasks.filter(function(t){return t.b===sel}).length;
    if(sel==="focus"){alert("«"+branch(sel).name+"» хранит заметки фокуса — её удалить нельзя, но можно переименовать.");return}
    if(cnt){alert("В этой ветке задач: "+cnt+". Сначала перенеси их в другие ветки (карандашик у задачи → «Ветка»), потом удали кружок.");return}
    if(!confirm("Удалить кружок «"+branch(sel).name+"»?"))return;
    gEdit.branches=gEdit.branches.filter(function(b){return b.id!==sel});delete G.pos[sel];
    G.links=G.links.filter(function(l){return l[0]!==sel&&l[1]!==sel});gEdit.sel=null;redrawGraphUI();
  }
}

/* ---------- отрисовка страницы ---------- */
function navBtn(v,label,n,late){
  return '<button class="nav'+(view===v?" on":"")+'" data-act="go" data-v="'+esc(v)+'">'+esc(label)+(n!=null?'<span class="n'+(late?" late":"")+'">'+n+'</span>':"")+'</button>';
}
function render(){
  if(!S)return;
  TODAY=todayISO();
  var all=S.tasks,op=open(all),late=op.filter(function(t){return state(t)==="late"}),tod=op.filter(function(t){return state(t)==="today"});
  function cntWho(p){return op.filter(function(t){return who(t).indexOf(p)>=0}).length}
  var side='<div class="brand">Штаб ассистента<small>Светлана · София</small></div>'+
   navBtn("overview","Обзор")+
   navBtn("now","Сегодня и просрочено",late.length+tod.length,late.length>0)+
   navBtn("who:v","Напомнить Светлане",cntWho("v"))+
   navBtn("who:w","Владимир",cntWho("w"))+
   navBtn("who:s","София",cntWho("s"))+
   navBtn("all","Все задачи",op.length)+
   '<div class="navh">Ветки</div>'+
   S.branches.map(function(b){var ts=open(all.filter(function(t){return t.b===b.id}));
     return navBtn("b:"+b.id,b.name,b.id==="focus"?null:ts.length,ts.some(function(t){return state(t)==="late"}))}).join("")+
   '<div class="navh">Аккаунт</div><div class="acct">'+esc(userEmail)+'</div><button class="nav" data-act="logout">Выйти</button>';
  var main="",title="",lead="",crumb="",hpen="",after=null;
  if(view==="overview"){
    title="Обзор";lead="Нажми на кружок, чтобы открыть ветку. Карандашик справа — изменить карту.";
    main='<div class="stats"><div class="stat late"><b>'+late.length+'</b><span>просрочено</span></div><div class="stat today"><b>'+tod.length+'</b><span>на сегодня</span></div><div class="stat"><b>'+op.length+'</b><span>открыто</span></div><div class="stat"><b>'+all.filter(function(t){return t.x}).length+'</b><span>сделано</span></div></div>'+
     graphHTML()+'<div class="legend"><span><i style="background:var(--p-s)"></i>София</span><span><i style="background:var(--p-v)"></i>Светлана</span><span><i style="background:var(--p-w)"></i>Владимир</span></div>'+
     '<div class="group">Ближайшие задачи</div><ul class="tasks">'+op.slice().sort(sortT).slice(0,8).map(function(t){return taskHTML(t,true)}).join("")+'</ul>'+addBtn({});
    after=function(){drawGraph();bindGraph()};
  } else if(view==="now"){
    title="Сегодня и просрочено";lead="Сначала закрываем просроченное, потом сегодняшнее.";
    main=listGrouped(late.concat(tod),true)+addBtn({});
  } else if(view==="all"){
    title="Все задачи";lead=ganttMode==="gantt"?"Гант по веткам. Нажми на задачу или полоску, чтобы изменить. Вертикальная линия — сегодня.":"Одна лента: чем раньше срок, тем выше задача.";
    main='<div class="toolbar"><div class="seg"><button class="'+(ganttMode==="gantt"?"on":"")+'" data-act="gmode" data-v="gantt">Гант</button><button class="'+(ganttMode==="list"?"on":"")+'" data-act="gmode" data-v="list">Список</button></div>'+
     '<label class="chk"><input type="checkbox" data-act="hide"'+(hideDone?" checked":"")+'> Скрыть сделанные</label></div>'+
     (ganttMode==="gantt"?ganttHTML(all):listGrouped(hideDone?op:all,true))+addBtn({});
    if(ganttMode==="gantt")after=scrollGantt;
  } else if(view.indexOf("who:")===0){
    var w=view.slice(4);
    title=w==="v"?"Напомнить Светлане":PN[w]||w;
    lead=w==="v"?"Задачи, в которых участвует Светлана. Задача Софии — напоминать, пока не будет сделано.":"Задачи, в которых участвует "+(PN[w]||w)+".";
    main=listGrouped(all.filter(function(t){return who(t).indexOf(w)>=0}),true)+addBtn({w:[w]});
  } else if(view.indexOf("b:")===0){
    var bid=view.slice(2),b=branch(bid);title=b.name;crumb="Ветки / "+b.name;
    hpen='<button class="pen" data-act="bren" data-id="'+esc(bid)+'" aria-label="Переименовать ветку">'+PEN+'</button>';
    if(bid==="focus"){lead="Заметки для Светланы и Софии: на чём держим фокус.";main=notesHTML()+'<div class="group">Задачи ветки</div>'+listGrouped(all.filter(function(t){return t.b==="focus"}),false)+addBtn({b:"focus",w:["v"]});}
    else{lead="Задачи ветки по сроку.";main=listGrouped(all.filter(function(t){return t.b===bid}),false)+addBtn({b:bid});}
  } else {view="overview";return render()}
  var sy=window.scrollY;
  $("app").innerHTML='<div class="top"><button class="hamb" data-act="drawer" aria-label="Меню">'+HAMB+'</button><span class="ttl">'+esc(title)+'</span><span class="save">'+esc(status)+'</span></div>'+
   '<aside id="side">'+side+'</aside><div class="scrim" data-act="drawer"></div>'+
   '<main><div class="crumb">'+esc(crumb||"Штаб ассистента")+'<span class="save">'+esc(status)+'</span></div><div class="hrow"><h1>'+esc(title)+'</h1>'+hpen+'</div><p class="lead">'+esc(lead)+'</p>'+main+'</main>';
  if(after)after();
  window.scrollTo(0,sy);
}
function go(v){view=v;gEdit=null;noteEdit=null;newNote=null;try{sessionStorage.setItem("sn-view",view)}catch(x){}document.body.classList.remove("drawer-open");render();window.scrollTo(0,0)}

/* ---------- события ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;var a=el.getAttribute("data-act");
  if(a==="logout"){sb.auth.signOut().finally(function(){pendingOps=[];showLogin()});return}
  if(!S)return;
  var tid=el.closest("[data-id]")?el.closest("[data-id]").getAttribute("data-id"):null;
  if(a==="go"){if(gEdit)return;go(el.getAttribute("data-v"));}
  else if(a==="drawer"){document.body.classList.toggle("drawer-open")}
  else if(a==="edit"){openModal(tid)}
  else if(a==="new"){var d={};try{d=JSON.parse(el.getAttribute("data-def")||"{}")}catch(x){}openModal(null,d)}
  else if(a==="mclose"){closeModal()}
  else if(a==="mdel"){if(confirm("Удалить задачу совсем?")){var id=modal.id;closeModal();doOp({k:"del",id:id})}}
  else if(a==="gmode"){ganttMode=el.getAttribute("data-v");try{localStorage.setItem("sn-gmode",ganttMode)}catch(x){}render()}
  else if(a==="bren"){var cur=branch(tid).name,nn=prompt("Новое название ветки:",cur);if(nn&&nn.trim()&&nn.trim()!==cur)doOp({k:"bren",id:tid,name:nn.trim()})}
  else if(a==="nedit"){noteEdit=tid;newNote=null;render()}
  else if(a==="nadd"){newNote={id:"n"+Date.now(),title:"",text:""};noteEdit=newNote.id;render();var f=$("ntt");if(f)f.focus()}
  else if(a==="ncancel"){noteEdit=null;newNote=null;render()}
  else if(a==="nsave"){
    var title=$("ntt").value.trim(),text=$("ntx").value.replace(/\s+$/,"");
    var notes=clone(S.notes),found=false;
    notes.forEach(function(n){if(n.id===noteEdit){n.title=title;n.text=text;found=true}});
    if(!found&&(title||text))notes.push({id:noteEdit,title:title,text:text});
    noteEdit=null;newNote=null;doOp({k:"notes",notes:notes});
  }
  else if(a==="ndel"){if(confirm("Удалить заметку?")){var nid=noteEdit;noteEdit=null;doOp({k:"notes",notes:S.notes.filter(function(n){return n.id!==nid})})}}
  else if(a.charAt(0)==="g"&&a!=="go")graphAct(a);
});
document.addEventListener("change",function(e){
  if(!S)return;var a=e.target.getAttribute("data-act");
  if(a==="tog")doOp({k:"tog",id:e.target.closest("[data-id]").getAttribute("data-id"),x:e.target.checked});
  else if(a==="hide"){hideDone=e.target.checked;try{localStorage.setItem("sn-hide",hideDone?"1":"0")}catch(x){}render()}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){if(modal)closeModal();document.body.classList.remove("drawer-open")}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("g.node[data-act]")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
});
var rt=null;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){if(S&&$("gsvg"))drawGraph()},120)});
window.addEventListener("beforeunload",function(e){if(pendingOps.length){e.preventDefault();e.returnValue=""}});

sb.auth.getSession().then(function(r){if(r.data&&r.data.session)start(r.data.session);else showLogin()}).catch(function(){showLogin()});
sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_OUT"&&S)showLogin("Сессия закончилась — войди снова")});
})();
</script>
</body></html>
